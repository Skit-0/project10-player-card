<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKILL PARAMETER OVERVIEW & PROFILE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="player-card">
        <div class="player-panel">
            <div class="player-card-frame">
                <div class="player-name">
                    MANNY
                </div>
                
                <div class="portrait-frame">
                    <div class="pentagon-boot" id="pentagon-boot">
                        <div class="boot-piece piece-1"></div>
                        <div class="boot-piece piece-2"></div>
                        <div class="boot-piece piece-3"></div>
                        <div class="boot-piece piece-4"></div>
                        <div class="boot-piece piece-5"></div>
                    </div>

                    <img id="player-image" src="" alt="Player portrait">
                </div>

                <input type="file" id="image-upload" accept="image/*" hidden>

                <button id="import-image">IMPORT PLAYER PICTURE</button>
                <div class="lower-stat-frame">
                    <div class="total-label">TOTAL</div>
                    <div class="total-score" id="overall-score">82</div>
                    <div class="overall-grade" id="overall-grade">A</div>
                </div>
            </div>
            
            <div class="grading-system">
                <div class="grading-info" tabindex="0">
                    <span class="info-icon">i</span>
                    <div class="info-tooltip">
                        <div class="tooltip-title">WEIGHTED RATING</div>
                        <div class="tooltip-row"><span>DRIBBLE</span><span>20%</span></div>
                        <div class="tooltip-row"><span>SHOOT</span><span>20%</span></div>
                        <div class="tooltip-row"><span>SPEED</span><span>15%</span></div>
                        <div class="tooltip-row"><span>OFFENSE</span><span>15%</span></div>
                        <div class="tooltip-row"><span>PASS</span><span>15%</span></div>
                        <div class="tooltip-row"><span>DEFENSE</span><span>15%</span></div>
                        <div class="tooltip-note">Total score is the weighted sum of all 6 stats and is used to determine the overall grade.
            </div>
                    </div>
                </div>  
                <div class="grade-row" data-grade="S+"><span>S+</span><span>100 ~ 110</span></div>
                <div class="grade-row" data-grade="S"><span>S</span><span>90 ~ 99</span></div>
                <div class="grade-row" data-grade="A"><span>A</span><span>80 ~ 89</span></div>
                <div class="grade-row" data-grade="B"><span>B</span><span>70 ~ 79</span></div>
                <div class="grade-row" data-grade="C"><span>C</span><span>60 ~ 69</span></div>
                <div class="grade-row" data-grade="D"><span>D</span><span>50 ~ 59</span></div>
                <div class="grade-row" data-grade="E"><span>E</span><span>40 ~ 49</span></div>
                <div class="grade-row" data-grade="F"><span>F</span><span>30 ~ 39</span></div>
                <div class="grade-row" data-grade="G"><span>G</span><span>0 ~ 29</span></div>
                </div>
            </div>

                        <div class="radar-panel">
                <button id="edit-stats-btn" class="edit-stats-btn" type="button">EDIT</button>

                <div id="radar-chart">
                    <svg id="radar" viewBox="-125 -135 750 750" role="img" aria-label="Player stat radar chart">
                        <g id="radar-grid"></g>
                        <g id="radar-max-values"></g>
                        <polygon id="radar-shape"></polygon>
                        <g id="radar-points"></g>
                        <g id="radar-labels"></g>
                        <g id="radar-grades"></g>
                        <g id="radar-hud-editor"></g>
                    </svg>
                </div>
            </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
